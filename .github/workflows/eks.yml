name: eks

# cluster 층을 코어타임(평일 KST)에만 띄운다. 운영 방법은 README.md
# - 올리기: 평일 13:40 KST. 저장소 변수 EKS_SCHEDULE_ENABLED=true 일 때만 돈다
# - 정리: 매시 5분, 35분. 코어타임이 17:30에 끝나서 30분 간격으로 본다. 코어타임 밖이면 eks.sh sweep 이 cluster 층을 지운다. 끄는 스위치가 없다
on:
  schedule:
    - cron: "40 4 * * 1-5" # 13:40 KST. eks.sh 의 UP_AT 과 같아야 한다
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "eks.sh 명령"
        type: choice
        options: [up, down, sweep, leftovers]
        required: true

permissions:
  contents: read

# up 과 down 이 겹치지 않게 한다. 대기 중인 실행은 취소하지 않는다
concurrency:
  group: eks
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  eks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 스케줄이 승인을 기다리지 않게 승인 규칙 없는 Environment 를 쓴다. 배포 브랜치는 main 으로 제한한다
    environment: eks
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Decide action
        id: action
        env:
          INPUT: ${{ github.event.inputs.action }}
          CRON: ${{ github.event.schedule }}
          ENABLED: ${{ vars.EKS_SCHEDULE_ENABLED }}
          ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
        run: |
          if [ -n "$INPUT" ]; then action="$INPUT"
          elif [ "$CRON" != "30 0 * * 1-5" ]; then action=sweep
          elif [ "$ENABLED" = "true" ]; then action=up
          else action=skip; echo "::notice::EKS_SCHEDULE_ENABLED 가 true 가 아니라 올리지 않습니다."
          fi
          if [ -z "$ROLE" ] || [ -z "$TF_VAR_aws_account_id" ]; then action=skip; echo "::notice::AWS_APPLY_ROLE_ARN 또는 AWS_ACCOUNT_ID 가 없어 건너뜁니다."; fi
          echo "name=$action" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.action.outputs.name != 'skip'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.action.outputs.name != 'skip'
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 3600
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.action.outputs.name != 'skip'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: eks.sh ${{ steps.action.outputs.name }}
        if: steps.action.outputs.name != 'skip'
        env:
          EKS_HOLD_UNTIL: ${{ vars.EKS_HOLD_UNTIL }}
          TF_VAR_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
          ACTION: ${{ steps.action.outputs.name }}
        run: terraform/eks.sh "$ACTION"
