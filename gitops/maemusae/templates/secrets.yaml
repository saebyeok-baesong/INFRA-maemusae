# Secrets Manager → Kubernetes Secret. 인증은 External Secrets 컨트롤러의 Pod Identity 를 쓴다 (maemusae/* 와 RDS 마스터 비밀만 읽을 수 있음)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
# api 비밀. maemusae/api 는 JSON 이고 키 이름이 그대로 환경변수가 된다
#   필수: JWT_SECRET_KEY, PII_ENCRYPTION_KEYS, PII_HMAC_KEY   선택: MMS_AI_KEY_ENCRYPTION_KEY
# maemusae/openai 는 키 문자열 그대로(JSON 아님)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: api-secrets
  dataFrom:
    - extract:
        key: maemusae/api
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: maemusae/openai
---
# DB 접속 주소. RDS 가 관리하는 service 마스터 비밀(username, password)로 만든다
# ponytail: 마스터 사용자를 그대로 쓴다. 운영 전에 앱 전용 DB 사용자로 바꾼다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws
  target:
    name: db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql+psycopg://{{`{{ .username | urlquery }}`}}:{{`{{ .password | urlquery }}`}}@<service RDS 주소>:5432/service?sslmode=require"
  dataFrom:
    - extract:
        key: <service RDS 마스터 비밀 ARN>
