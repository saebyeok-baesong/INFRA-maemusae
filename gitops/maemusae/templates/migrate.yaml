# DB 마이그레이션. sync 마다 api 보다 먼저 한 번 돈다(wave 0). 실패하면 api, web 은 바뀌지 않는다
# api 이미지를 명령만 바꿔 쓴다. 관리자 시드는 넣지 않는다 (SERVICE seed-admin 이 따로 한 번)
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        role: app
      tolerations:
        - { key: role, operator: Equal, value: app, effect: NoSchedule }
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: {{ required "gitops/apps/images.yaml 에 api 이 없다" .Values.api }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
            - secretRef: { name: db }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
