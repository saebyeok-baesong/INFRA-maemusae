# 정문. Traefik(NLB 뒤)이 받는다. 경로는 /api 와 / 두 개뿐이라 /metrics, /health, /docs 는 밖에서 닿지 않는다
# 도메인이 생기면 host 와 TLS 를 더한다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maemusae
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
